<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credits - game with no title</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Credits</h1>
    <nav class="site-actions" aria-label="Site navigation">
      <a class="nav-button" href="index.html">Home</a>
    </nav>
  </header>

  <main class="credits-page">
    <section class="credits-panel" aria-labelledby="credits-heading">
      <h2 id="credits-heading">Game Credits</h2>
      <ul class="credits-list">
        <li>
          <span class="credit-name">Vitor</span>
          <span class="credit-role">Programmer</span>
        </li>
        <li>
          <span class="credit-name">Bitsy</span>
          <span class="credit-role">Pixel Artist</span>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
